services:

  db:
    image: postgres:18-alpine3.23
    environment:
      - POSTGRES_USER=django
      - POSTGRES_PASSWORD=django
      - POSTGRES_DB=recipe
    ports:
      - 5432:5432
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django -d recipe"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
  app: 
    build:
      context: .
      args:
        - DEV=true
    ports:
      - 8000:8000
    volumes:
      - ./app:/app
      - app_data:/vol/web
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_NAME=recipe
      - DB_USER=django
      - DB_PASSWORD=django
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
  app_data:

      